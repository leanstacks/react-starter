name: Deploy (Reusable)

on:
  workflow_call:
    inputs:
      aws_region:
        type: string
        required: false
        default: 'us-east-1'
      aws_role_arn:
        type: string
        required: true
      env:
        type: string
        required: false
        default: 'dev'
      env_file:
        type: string
        required: true
      cdk_env_file:
        type: string
        required: true

jobs:
  deploy:
    name: Deploy

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Create web .env file
        working-directory: ./packages/web
        run: |
          echo "${{ inputs.env_file }}" > .env
          echo "VITE_BUILD_DATE=$(date -u +'%Y-%m-%d')" >> .env
          echo "VITE_BUILD_TIME=$(date -u +'%H:%M:%S')" >> .env
          echo "VITE_BUILD_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env
          echo "VITE_BUILD_COMMIT_SHA=${{ github.sha }}" >> .env
          echo "VITE_BUILD_ENV_CODE=${{ inputs.env }}" >> .env
          echo "VITE_BUILD_WORKFLOW_NAME=${{ github.workflow }}" >> .env
          echo "VITE_BUILD_WORKFLOW_RUN_NUMBER=${{ github.run_number }}" >> .env
          echo "VITE_BUILD_WORKFLOW_RUN_ATTEMPT=${{ github.run_attempt }}" >> .env

      - name: Create infrastructure .env file
        working-directory: ./packages/infra
        run: |
          echo "${{ inputs.cdk_env_file }}" > .env

      - name: Build the app
        run: npm run build

      - name: Build storybook
        run: npm run build:storybook -w packages/web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: deploy-react-starter-${{ github.run_id }}

      - name: Bootstrap CDK
        working-directory: ./packages/infra
        run: |
          echo "⚡ Checking if CDK bootstrap is needed..."
          # Try to describe the bootstrap stack to see if it exists
          if ! aws cloudformation describe-stacks --stack-name CDKToolkit --region ${{ inputs.aws_region }} >/dev/null 2>&1; then
            echo "🚀 CDK not bootstrapped, bootstrapping now..."
            npx cdk bootstrap
          else
            echo "✅ CDK already bootstrapped, skipping..."
          fi

      - name: Synthesize CDK stacks
        run: npm run synth -w packages/infra

      - name: Deploy CDK stacks
        run: npm run deploy:all -w packages/infra

      - name: Clean up sensitive files
        if: always()
        run: |
          echo "🧹 Cleaning up sensitive files..."
          rm -f packages/web/.env
          rm -rf packages/web/dist
          rm -rf packages/web/storybook-static
          rm -f packages/infra/.env
          rm -rf packages/infra/dist
          rm -rf packages/infra/cdk.out
          rm -rf packages/shared/dist
          echo "✅ Sensitive files cleaned up"
